<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="neura-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#1E2028" />
      <stop offset="100%" stopColor="#0A0A0E" />
    </linearGradient>
    <linearGradient id="neura-grad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38BDF8" />
      <stop offset="50%" stopColor="#3B82F6" />
      <stop offset="100%" stopColor="#8B5CF6" />
    </linearGradient>
    <linearGradient id="neura-core" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#60A5FA" />
      <stop offset="100%" stopColor="#C084FC" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#neura-bg)" stroke="url(#neura-grad)" stroke-width="1.8" stroke-opacity="0.6" />

  <!-- Code Brackets < > -->
  <path d="M21 21L13 32L21 43" stroke="url(#neura-grad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M43 21L51 32L43 43" stroke="url(#neura-grad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Neural Core -->
  <g filter="url(#glow)">
    <path d="M32 19V45M21 32H43M25 25L39 39M39 25L25 39" stroke="url(#neura-core)" stroke-width="2" stroke-opacity="0.8" stroke-dasharray="3 3" />
    <circle cx="32" cy="32" r="5" fill="#38BDF8" />
    <circle cx="32" cy="32" r="7" stroke="#60A5FA" stroke-width="1.5" stroke-opacity="0.7" />
    
    <circle cx="32" cy="19" r="2.8" fill="#818CF8" />
    <circle cx="32" cy="45" r="2.8" fill="#A855F7" />
    <circle cx="21" cy="32" r="2.8" fill="#38BDF8" />
    <circle cx="43" cy="32" r="2.8" fill="#C084FC" />
  </g>
</svg>
